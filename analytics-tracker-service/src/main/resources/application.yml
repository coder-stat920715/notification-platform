server:
  port: 8086
spring:
  application:
    name: analytics-tracker-service
  datasource:
    url: jdbc:postgresql://localhost:5432/notify
    username: notify
    password: notify
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      concurrency: 3
    consumer:
      group-id: analytics-tracker
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.acme.notify.common.StatusEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.acme.notify.common
notify:
  kafka:
    status-partitions: 6
    replicas: 1
  twilio:
    verify-signature: false          # set true and provide the token in production
    auth-token: ${TWILIO_AUTH_TOKEN:}
    public-base-url: ${TWILIO_CALLBACK_BASE_URL:http://localhost:8086}
management:
  endpoints:
    web:
      exposure:
        include: health,info
